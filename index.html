<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>67</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #number {
      position: absolute;
      left: 50%;
      top: 50%;
      font-family: Arial, sans-serif;
      font-size: 100px;
      font-weight: 900;
      color: white;
      user-select: none;
      will-change: transform;
    }
  </style>
</head>

<body>

  <div id="number">67</div>

  <script>
    const number = document.getElementById("number");

    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;

    let vx = 0;
    let vy = 0;

    let rotation = 0;
    let rotationSpeed = 0;

    const gravity = 0.35;
    const bounce = 0.75;

    function randomLaunch() {
      vx = (Math.random() - 0.5) * 30;
      vy = -Math.random() * 25 - 8;
      rotationSpeed = (Math.random() - 0.5) * 12;
    }

    function animate() {
      const rect = number.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      vy += gravity;

      x += vx;
      y += vy;
      rotation += rotationSpeed;

      if (y + height / 2 >= window.innerHeight) {
        y = window.innerHeight - height / 2;
        vy *= -bounce;
        vx *= 0.98;

        if (Math.abs(vy) < 3) {
          randomLaunch();
        }
      }

      if (y - height / 2 <= 0) {
        y = height / 2;
        vy *= -0.8;
      }

      if (x - width / 2 <= 0) {
        x = width / 2;
        vx *= -0.85;
        rotationSpeed *= -1;
      }

      if (x + width / 2 >= window.innerWidth) {
        x = window.innerWidth - width / 2;
        vx *= -0.85;
        rotationSpeed *= -1;
      }

      number.style.transform =
        `translate(-50%, -50%) translate(
          ${x - window.innerWidth / 2}px,
          ${y - window.innerHeight / 2}px
        ) rotate(${rotation}deg)`;

      requestAnimationFrame(animate);
    }

    randomLaunch();
    animate();

    window.addEventListener("resize", () => {
      x = Math.min(x, window.innerWidth);
      y = Math.min(y, window.innerHeight);
    });
  </script>

</body>
</html>

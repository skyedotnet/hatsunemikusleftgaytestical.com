<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyeOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="desktop">

    <!-- Desktop icons -->
    <div class="desktop-icons">
      <button class="desktop-icon" data-open="computer">
        <span>💻</span>
        Computer
      </button>

      <button class="desktop-icon" data-open="notepad">
        <span>📄</span>
        Notepad
      </button>

      <button class="desktop-icon" data-open="about">
        <span>🌐</span>
        About Me
      </button>

      <button class="desktop-icon" data-open="projects">
        <span>📁</span>
        Projects
      </button>
    </div>

    <!-- Windows appear here -->
    <div id="windows"></div>

    <!-- Start menu -->
    <div id="start-menu" class="hidden">
      <div class="start-header">
        <div class="avatar">S</div>

        <div>
          <strong>Skye</strong>
          <small>Personal Desktop</small>
        </div>
      </div>

      <div class="start-content">

        <div class="start-apps">
          <button data-open="computer">💻 Computer</button>
          <button data-open="notepad">📄 Notepad</button>
          <button data-open="about">🌐 About Me</button>
          <button data-open="projects">📁 Projects</button>
        </div>

        <div class="start-side">
          <button data-open="control">⚙ Control Panel</button>
          <button id="run-button">▶ Run...</button>
          <button id="shutdown-button">⏻ Shut Down</button>
        </div>

      </div>

      <input
        id="start-search"
        placeholder="Search programs and files"
      >
    </div>

    <!-- Taskbar -->
    <div class="taskbar">

      <button id="start-button" class="start-button">
        ⊞
      </button>

      <div id="task-buttons"></div>

      <div class="system-tray">
        <span>📶</span>
        <span>🔊</span>
        <span id="clock"></span>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

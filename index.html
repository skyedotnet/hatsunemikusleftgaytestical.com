<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>21</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #counter {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      z-index: 10;
      user-select: none;
    }

    #number {
      position: absolute;
      left: 50%;
      top: 50%;
      font-family: Arial, sans-serif;
      font-size: 100px;
      font-weight: 900;
      color: white;
      user-select: none;
      will-change: transform;
    }
  </style>
</head>

<body>

  <div id="counter">Bounces: 0</div>
  <div id="number">21</div>

  <script>
    const number = document.getElementById("number");
    const counter = document.getElementById("counter");

    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;

    let vx = 0;
    let vy = 0;

    let rotation = 0;
    let rotationSpeed = 0;

    let mouseX = -1000;
    let mouseY = -1000;

    let bounceCount = 0;

    const gravity = 0.35;
    const bounce = 0.75;
    const mouseRadius = 45;

    const originalSize = 100;

    document.addEventListener("mousemove", (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;
    });

    function addBounce() {
      bounceCount++;

      // 5% bigger every 100 bounces
      const multiplier = Math.pow(1.05, Math.floor(bounceCount / 100));

      number.style.fontSize = `${originalSize * multiplier}px`;

      counter.textContent = `Bounces: ${bounceCount}`;
    }

    function randomLaunch() {
      vx = (Math.random() - 0.5) * 30;
      vy = -Math.random() * 25 - 8;
      rotationSpeed = (Math.random() - 0.5) * 12;
    }

    function animate() {
      const rect = number.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      const numberRadius = Math.max(width, height) / 2;

      vy += gravity;

      x += vx;
      y += vy;
      rotation += rotationSpeed;

      // Mouse collision
      const dx = x - mouseX;
      const dy = y - mouseY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      const collisionDistance = mouseRadius + numberRadius * 0.7;

      if (distance < collisionDistance && distance > 0) {
        const nx = dx / distance;
        const ny = dy / distance;

        x = mouseX + nx * collisionDistance;
        y = mouseY + ny * collisionDistance;

        const velocityAlongNormal = vx * nx + vy * ny;

        if (velocityAlongNormal < 0) {
          vx -= 2 * velocityAlongNormal * nx;
          vy -= 2 * velocityAlongNormal * ny;

          vx *= 1.15;
          vy *= 1.15;

          rotationSpeed = (Math.random() - 0.5) * 15;

          addBounce();
        }
      }

      // Floor
      if (y + height / 2 >= window.innerHeight) {
        y = window.innerHeight - height / 2;
        vy *= -bounce;
        vx *= 0.98;

        addBounce();

        if (Math.abs(vy) < 3) {
          randomLaunch();
        }
      }

      // Ceiling
      if (y - height / 2 <= 0) {
        y = height / 2;
        vy *= -0.8;
        addBounce();
      }

      // Left wall
      if (x - width / 2 <= 0) {
        x = width / 2;
        vx *= -0.85;
        rotationSpeed *= -1;
        addBounce();
      }

      // Right wall
      if (x + width / 2 >= window.innerWidth) {
        x = window.innerWidth - width / 2;
        vx *= -0.85;
        rotationSpeed *= -1;
        addBounce();
      }

      number.style.transform =
        `translate(-50%, -50%) translate(
          ${x - window.innerWidth / 2}px,
          ${y - window.innerHeight / 2}px
        ) rotate(${rotation}deg)`;

      requestAnimationFrame(animate);
    }

    randomLaunch();
    animate();

    window.addEventListener("resize", () => {
      x = Math.min(x, window.innerWidth);
      y = Math.min(y, window.innerHeight);
    });
  </script>

</body>
</html>
